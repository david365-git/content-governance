  function runStage0() {
    setGenerating('status0','gen0btn','W0');
    google.script.run
      .withSuccessHandler(function(status) {
        if (status.success) {
          toggleW0BVisibility(status.articleType);
          google.script.run
            .withSuccessHandler(function(p) {
              document.getElementById('part0').value = p;
              setDone('status0','gen0btn','Generate','PASS | ID: ' + status.postID + ' — copy then paste to ChatGPT','conf0btn');
            })
            .withFailureHandler(function(err) { setFail('status0','gen0btn','Generate',err.message); })
            .generateForensicPrompt();
        } else {
          setFail('status0','gen0btn','Generate','No GSC monitor data — click ⚙ Populate from Governance below');
          // Show governance bypass button
          var btnRow = document.getElementById('gen0btn').parentElement;
          if (!document.getElementById('govBypassBtn')) {
            var btn = document.createElement('button');
            btn.id = 'govBypassBtn';
            btn.className = 'btn-forensic';
            btn.style.background = '#6a1b9a';
            btn.textContent = '⚙ Populate from Governance';
            btn.onclick = function() {
              btn.disabled = true;
              btn.textContent = 'Populating...';
              document.getElementById('status0').textContent = 'Populating W0 fields from governance data...';
              document.getElementById('status0').className = 'status-bar generating';
              google.script.run
                .withSuccessHandler(function(result) {
                  if (result.success) {
                    setDone('status0','gen0btn','Generate','GOVERNANCE BYPASS | ' + result.message);
                    btn.textContent = '✔ Populated';
                    btn.style.background = '#2e7d32';
                  } else {
                    setFail('status0','gen0btn','Generate', result.message);
                    btn.disabled = false;
                    btn.textContent = '⚙ Populate from Governance';
                  }
                })
                .withFailureHandler(function(err) {
                  setFail('status0','gen0btn','Generate', err.message);
                  btn.disabled = false;
                  btn.textContent = '⚙ Populate from Governance';
                })
                .populateStage0FromGovernance();
            };
            btnRow.appendChild(btn);
          }
        }
      })
      .withFailureHandler(function(err) { setFail('status0','gen0btn','Generate',err.message); })
      .checkGSCDataStatus();
  }

 function saveStage15AToSheet() {
    var output = document.getElementById('part15a_output').value.trim();
    if (!output) { setStatus('status15a','fail','❌ No structure to save'); return; }
    setStatus('status15a','saving','Saving structure to Column CU...');
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          setStatus('status15a','done','✔ Structure saved to Column CU');
          document.getElementById('save15abtn').innerText = '✔ Saved';
          document.getElementById('save15abtn').disabled = true;

          // GOVERNANCE CHAIN: once genuinely saved to CU, auto-open
          // W1.5B (window id 8) and auto-run its Generate Prompt.
          // Small delay so the success message actually paints on screen
          // before the window switches away.
          setTimeout(function() {
            navGoTo(8);
            if (typeof runStage15B === 'function') runStage15B();
          }, 700);
        }
        else { setStatus('status15a','fail','❌ ' + res.message); }
      })
      .withFailureHandler(function(err) { setStatus('status15a','fail','❌ Save failed: ' + err.message); })
      .saveStage15AStructure(output);
  }

  function run15BAutomated() {

    var btn = document.getElementById('auto15bbtn');
    var statusDiv = document.getElementById('auto15bStatus');

    var startTime = Date.now();

    btn.disabled = true;
    btn.innerText = 'Running…';

    statusDiv.innerText = '⏳ W1.5B running...';
    statusDiv.style.color = '';

    var dots = 0;

    var progressTimer = setInterval(function() {
      dots = (dots + 1) % 4;

      var elapsed = Math.floor((Date.now() - startTime) / 1000);

      statusDiv.innerText =
        '⏳ W1.5B running' +
        '.'.repeat(dots) +
        '  ' +
        elapsed +
        's';
    }, 1000);

    google.script.run

      .withSuccessHandler(function(res) {

        clearInterval(progressTimer);

        var elapsedSeconds =
          ((Date.now() - startTime) / 1000).toFixed(1);

        btn.disabled = false;
        btn.innerText = '⚡ Run W1.5B Automated';

        if (res.success) {

          statusDiv.innerText =
            '✔ ' +
            res.message +
            ' — Time: ' +
            elapsedSeconds +
            's — Cost: $' +
            res.cost.toFixed(4);

        } else {

        statusDiv.innerText =
          '❌ ' +
          res.message +
          ' — Time: ' +
          elapsedSeconds +
          's — Cost: $' +
          Number(res.cost || 0).toFixed(4);

        statusDiv.style.color = '#c62828';
      }
      })

    .withFailureHandler(function(err) {

      clearInterval(progressTimer);

      var elapsedSeconds =
        ((Date.now() - startTime) / 1000).toFixed(1);

      btn.disabled = false;
      btn.innerText = '⚡ Run W1.5B Automated';

      statusDiv.innerText =
        '❌ ' +
        err.message +
        ' — Time: ' +
        elapsedSeconds +
        's';

      statusDiv.style.color = '#c62828';
    })

    .bc_runFullW15BAutomated();
  }

  function applyEntityCoverageFix() {
  var fixBox = document.getElementById('entityCoverageFixResponse');
  var h2Box = document.getElementById('part15b_output');

  var correctedH2s = fixBox ? fixBox.value.trim() : '';

  if (!correctedH2s) {
    setLocalStatus(
      'entityCoverageFixLocalStatus',
      '❌ Paste the corrected H2s from ChatGPT first',
      true
    );
    return;
  }

  // Put corrected H2s back into the main H2 output box
  if (h2Box) h2Box.value = correctedH2s;

  // Enable the normal Save to CV button
  var saveBtn = document.getElementById('save15bbtn');
  if (saveBtn) saveBtn.disabled = false;

  // Save using the existing W1.5B save function
  saveStage15BToSheet(true);

  // Clear the old ChatGPT response so the stage is visibly reset
  if (fixBox) fixBox.value = '';
  var fixPromptBox = document.getElementById('entityCoverageFixPrompt');
if (fixPromptBox) fixPromptBox.value = '';

  setLocalStatus(
    'entityCoverageFixLocalStatus',
    '✔ Corrected H2s sent to H2 OUTPUT and saving to CV…',
    false
  );
}

  function updateW15BGateBanner(passed) {
    var banner = document.getElementById('w15bGateBanner');

    banner.style.display = 'block';
    if (passed) {
      banner.style.background = '#e8f5e9';
      banner.style.color = '#2e7d32';
      banner.style.border = '2px solid #2e7d32';
      banner.textContent = '✔ H2s comply with Rewrite Brief — safe to proceed to W1.5C.';
    } else {
      banner.style.background = '#ffebee';
      banner.style.color = '#c62828';
      banner.style.border = '2px solid #c62828';
      banner.textContent = '⛔ DO NOT PROCEED TO W1.5C — H2s do not comply with Rewrite Brief. Regenerate H2s (Stage 1.5B) and re-run this check before continuing.';

  /* ══════════════════════════════════════════════════════════════
     W2B DEDICATED PROMPT CHUNKER
     Self-contained — splits the assembled W2B prompt at fixed,
     known structural boundaries (Stage 1A/1B/1C/1D, Stage 2A,
     Article Type Lock, Entity Vocab/TSM/Governance, Section Plan)
     so large blocks like the LSI entity list never land mid-cut.
     Any single chunk still over the safe limit is auto-subdivided.
  ══════════════════════════════════════════════════════════════ */

  var W2B_SAFE_CHARS = 100000;

  function w2bGenericSplit(text, maxChars) {
    var chunks = [];
    var remaining = text;
    var n = 1;
    while (remaining.length > 0) {
      if (remaining.length <= maxChars) {
        chunks.push({ text: remaining, label: 'Part ' + n });
        break;
      }
      var bp = maxChars;
      var pb = remaining.lastIndexOf('\n\n', maxChars);
      if (pb > maxChars * 0.5) {
        bp = pb + 2;
      } else {
        var lb = remaining.lastIndexOf('\n', maxChars);
        if (lb > maxChars * 0.5) bp = lb + 1;
      }
      if (bp <= 0) bp = maxChars;
      chunks.push({ text: remaining.substring(0, bp), label: 'Part ' + n });
      remaining = remaining.substring(bp);
      n++;
      if (n > 100) break;
    }
    return chunks;
  }

  function buildW2BChunks(p1, p2, p3) {
    var chunks = [
      { text: p1 + '\n\n---\n\n' + p2, label: 'Context + Rules (Stages 1A-1D, 2A, Governance, Entities)' },
      { text: p3, label: 'Page Rules, Approved Section Plan + Execute' }
    ];
    // Safety net only — subdivide further if either half is unexpectedly huge
    var expanded = [];
    chunks.forEach(function(c) {
      if (c.text.length <= W2B_SAFE_CHARS) { expanded.push(c); return; }
      var subs = w2bGenericSplit(c.text, W2B_SAFE_CHARS);
      subs.forEach(function(s, si) {
        expanded.push({ text: s.text, label: subs.length > 1 ? (c.label + ' — Part ' + (si + 1) + ' of ' + subs.length) : c.label });
      });
    });
    return expanded;
  }

  function wrapW2BChunk(text, idx, total, isLast) {
    if (isLast) {
      return 'ALL CHUNKS NOW LOADED — EXECUTE NOW\nAll previous chunks have been loaded into your context.\nProcess the full combined prompt now and return your complete output.\n\n' + text.trim();
    }
    var header = 'CHUNK ' + (idx + 1) + ' OF ' + total + ' — LOAD ONLY — DO NOT EXECUTE\nIngest and retain this section. Do not begin writing. Do not generate HTML. Wait for remaining chunks.';
    var footer = '\n\n--- HOLD ---\nDo not execute. Do not generate HTML. Do not begin writing.\nReply only with: READY FOR CHUNK ' + (idx + 2) + '\nNo other output.';
    return header + '\n\n' + text.trim() + footer;
  }

  function splitW2BForChatGPT() {
    var p1 = document.getElementById('part2b_p1').value;
    var p2 = document.getElementById('part2b_p2').value;
    var p3 = document.getElementById('part2b_p3').value;
    if (!p1 || !p2 || !p3) { alert('Generate the prompt first (Generate All Parts).'); return; }

    var chunks = buildW2BChunks(p1, p2, p3);
    var total = chunks.length;
    var summaryEl = document.getElementById('w2bChunkSummary');
    var outputEl = document.getElementById('w2bChunksOutput');
    outputEl.innerHTML = '';

    var totalChars = 0, maxChars = 0;
    chunks.forEach(function(c) { totalChars += c.text.length; if (c.text.length > maxChars) maxChars = c.text.length; });

    var combinedText = _buildSingleUploadPrompt(
      chunks.map(function(c) { return c.text; }).join('\n\n---\n\n'),
      'W2B — Abbey Floor Care Content Engine'
    );

    summaryEl.style.display = 'block';
    summaryEl.textContent = 'W2B — combined into 1 upload — ' + totalChars.toLocaleString() + ' chars total — ' + total + ' logical chunk marker(s) inside';

    var card = document.createElement('div');

        '<span style="font-family:JetBrains Mono,monospace;font-size:11px;font-weight:700">W2B — SINGLE COMBINED PROMPT</span>' +

      '</div>';
    outputEl.appendChild(card);
    document.getElementById('w2bcbtn-combined').onclick = function() {
      var btn = document.getElementById('w2bcbtn-combined');

  function renderW8ESMarkdown() {
    var raw = document.getElementById('w8esEditArea').value;
    var esc = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    var lines = esc.split('\n');
    var html = '';
    var inTable = false;
    lines.forEach(function(line) {
      if (/^\s*\|(.+)\|\s*$/.test(line)) {
        var cells = line.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
        if (/^:?-+:?$/.test(cells.join(''))) return; // separator row
        if (!inTable) { html += '<table style="width:100%;border-collapse:collapse;margin:8px 0">'; inTable = true; }
        html += '<tr>' + cells.map(function(c){ return '<td style="border:1px solid #ffcc80;padding:4px;font-size:12px">' + inlineMd(c) + '</td>'; }).join('') + '</tr>';
        return;
      } else if (inTable) { html += '</table>'; inTable = false; }

      if (/^###\s+/.test(line)) { html += '<h4 style="margin:10px 0 4px;color:#ef6c00">' + inlineMd(line.replace(/^###\s+/,'')) + '</h4>'; }
      else if (/^##\s+/.test(line)) { html += '<h3 style="margin:12px 0 6px;color:#ef6c00">' + inlineMd(line.replace(/^##\s+/,'')) + '</h3>'; }
      else if (/^#\s+/.test(line)) { html += '<h2 style="margin:14px 0 8px;color:#ef6c00">' + inlineMd(line.replace(/^#\s+/,'')) + '</h2>'; }
      else if (/^>\s?/.test(line)) { html += '<blockquote style="margin:6px 0;padding:6px 10px;background:#fff8e1;border-left:3px solid #ffb300">' + inlineMd(line.replace(/^>\s?/,'')) + '</blockquote>'; }
      else if (/^\s*[-*]\s+/.test(line)) { html += '<div style="margin:2px 0 2px 14px">• ' + inlineMd(line.replace(/^\s*[-*]\s+/,'')) + '</div>'; }
      else if (line.trim() === '') { html += '<div style="height:6px"></div>'; }
      else { html += '<div>' + inlineMd(line) + '</div>'; }
    });
    if (inTable) html += '</table>';
    document.getElementById('w8esRenderedBlock').innerHTML = html;
  }

  function inlineMd(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code style="background:#eee;padding:1px 4px;border-radius:2px">$1</code>');
  }

  function runW4BBuild() {
    var html = document.getElementById('w4bInputHtml').value.trim();

          if (/data-w4b-skip\s*=\s*["']true["']/i.test(imgMatch[0])) continue;
          var srcMatch = imgMatch[0].match(/src=["']([^"']+)["']/i);
          if (srcMatch) imgTags.push(srcMatch[1]);
        }
        var imgFilenames = imgTags.map(function(u) { return u.split('/').pop(); });
        var prompt = ['You are an SEO image specialist working on a UK natural stone floor restoration website.','','TASK: For each image filename below, return descriptive alt text and a caption appropriate to its category.','','CONTEXT:','  Stone type: ' + (meta.stoneType||'unknown'),'  Article type: ' + (meta.articleType||'unknown'),'  Primary search term: ' + (meta.primaryTerm||'unknown'),'','IMAGE CATEGORIES (classify each filename before writing alt/caption):','1. FLOOR CONDITION IMAGES — photos of the actual stone floor showing a condition, stage, or result. Write a descriptive alt AND a diagnostic caption that helps the reader identify their problem (e.g. "If your floor looks like this...").','2. PRODUCT IMAGES — any image from m.media-amazon.com, or any filename that is clearly a commercial product (cleaner bottle, vacuum, mop, brush, sealer, tool). These are NOT decorative. Write a plain descriptive alt stating what the product is (e.g. "Fila Pro Floor Cleaner for impregnated stone surfaces"). Caption should be empty string "" — product captions are handled separately by the page template, not by this diagnostic caption system.','3. TRUE DECORATIVE IMAGES — logos, icons, dividers, spacers with no informative content. Only these get alt="" and caption="".','','CRITICAL: Do not default to category 3 for product images. A product photo always gets a real descriptive alt text in category 2 — only alt text is ever blank for icons/logos/dividers with zero informative value.','','RULES:','- Alt text: descriptive, specific, under 125 characters. No keyword stuffing.','- Captions (floor condition images only): plain text only, max 15 words, diagnostic — help the reader identify their problem.','- Return ONLY a JSON array. No preamble. No markdown fences. No explanation.','','OUTPUT FORMAT:','[{"filename":"[filename]","alt":"[alt text]","caption":"[caption]"}]','','IMAGE FILENAMES:',imgFilenames.join('\n')].join('\n');
        document.getElementById('w4bPrompt').value = prompt;
        document.getElementById('w4bPromptBlock').style.display = 'block';
        setStatus('statusW4B','done','✔ ' + imgCount + ' image(s) found — copy prompt → paste into ChatGPT → paste corrected HTML into W4');
      })
      .withFailureHandler(function() {
        var prompt = ['You are an SEO image specialist working on a UK natural stone floor restoration website.','','TASK: Review every <img> tag in the HTML below.','For each image:','- If alt text is missing or empty, write a descriptive alt.','- If generic, rewrite it. If accurate, keep it.','- Wrap content images in <figure> with <figcaption> (max 15 words).','- Decorative: alt="" no figcaption.','','RULES: Alt under 125 chars. Captions plain text. Return COMPLETE HTML with ONLY alt and figure/figcaption changed. Raw HTML only.','','HTML:',html].join('\n');
        document.getElementById('w4bPrompt').value = prompt;
        document.getElementById('w4bPromptBlock').style.display = 'block';
        setStatus('statusW4B','done','✔ ' + imgCount + ' image(s) — prompt ready');
      })

      resultDiv.style.display = 'block';

  function displayComparisonResult() {
    var raw = document.getElementById('comparisonResponse').value.trim();
    if (!raw) { setStatus('status15f', 'fail', '❌ Paste Gemini\'s response first.'); return; }

    function extractField(label) {
      var re = new RegExp(label + ':\\s*([^\\n]+(?:\\n(?!\\w[\\w\\s]*:)[^\\n]*)*)', 'i');
      var m = raw.match(re);
      return m ? m[1].trim() : '';
    }

    var defects = extractField('STRUCTURAL DEFECTS FOUND');
    var relevance = extractField('SEARCH RELEVANCE');
    var integrity = extractField('INFORMATION INTEGRITY');
    var additions = extractField('UNVERIFIED ADDITIONS IN REVISION B');
    var readability = extractField('READABILITY');
    var recommendation = extractField('OVERALL RECOMMENDATION');
    var hasDefects = defects && !/^none/i.test(defects);
    var hasAdditions = additions && !/^none/i.test(additions);

    var html =
      '<div style="margin-bottom:8px;padding:8px;border-left:3px solid ' + (hasDefects ? '#c62828' : '#2e7d32') + ';background:#f9f9f9">' +
      '<div style="font-weight:700;color:' + (hasDefects ? '#c62828' : '#2e7d32') + '">STRUCTURAL DEFECTS: ' + (hasDefects ? '⚠ FOUND' : '✔ None found') + '</div>' +
      (defects ? '<div style="font-size:11px;margin-top:4px;white-space:pre-wrap">' + defects + '</div>' : '') +
      '</div>' +
      '<div style="margin-bottom:6px"><strong>Search Relevance:</strong> ' + (relevance || '—') + '</div>' +
      '<div style="margin-bottom:6px"><strong>Information Integrity:</strong> ' + (integrity || '—') + '</div>' +
      '<div style="margin-bottom:8px;padding:8px;border-left:3px solid ' + (hasAdditions ? '#c62828' : '#2e7d32') + ';background:#f9f9f9">' +
      '<div style="font-weight:700;color:' + (hasAdditions ? '#c62828' : '#2e7d32') + '">UNVERIFIED ADDITIONS: ' + (hasAdditions ? '⚠ FOUND' : '✔ None found') + '</div>' +
      (additions ? '<div style="font-size:11px;margin-top:4px;white-space:pre-wrap">' + additions + '</div>' : '') +
      '</div>' +
      (function() {
        window._lastUnverifiedAdditions = additions;
        var section = document.getElementById('unverifiedFixSection');
        if (section) section.style.display = hasAdditions ? 'block' : 'none';
        return '';
      })() +
      '<div style="margin-bottom:6px"><strong>Readability:</strong> ' + (readability || '—') + '</div>' +
      '<div style="margin-top:8px;padding:8px;background:#fff3e0;border-radius:4px"><strong>Recommendation:</strong><br>' + (recommendation || raw) + '</div>';

    var resultEl = document.getElementById('comparisonResult');
    resultEl.innerHTML = html;
    setStatus('status15f', 'running', 'Saving comparison result to sheet…', true);

    google.script.run
      .withSuccessHandler(function(saveResult) {
        if (saveResult && saveResult.success) {
          setStatus('status15f', 'done', '✔ Comparison reviewed and saved to col FX. No action taken automatically — decide next step manually.');
        } else {

  function runW8DAnalysis() {
    setStatus('statusW8D', 'running', 'Running comparison analysis…', true);
    document.getElementById('w8dResultBlock').style.display = 'none';
    document.getElementById('w8dDecisionBlock').style.display = 'none';
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result.success) { setStatus('statusW8D', 'fail', '❌ ' + result.message); return; }

        var recColours = { 'PUBLISH': '#2e7d32', 'BORDERLINE': '#e65100', 'RUN AGAIN': '#c62828', 'REVIEW': '#e65100', 'IMPROVED — signals remain': '#e65100', 'NO IMPROVEMENT': '#c62828' };

        // Primary measure label
        document.getElementById('w8dScoreBefore').textContent = result.beforeValue;
        document.getElementById('w8dScoreBefore').style.color = recColours[result.originalRec] || '#37474f';
        document.getElementById('w8dRecBefore').textContent   = result.beforeLabel + ' — ' + result.originalRec;

        document.getElementById('w8dScoreAfter').textContent = result.afterValue;
        document.getElementById('w8dScoreAfter').style.color = recColours[result.newRec] || '#37474f';
        document.getElementById('w8dRecAfter').textContent   = result.afterLabel + ' — ' + result.newRec;

        // Movement
        var deltaEl      = document.getElementById('w8dScoreDelta');
        var deltaLabelEl = document.getElementById('w8dDeltaLabel');
        deltaEl.textContent      = result.scoreImproved ? '✔' : '✘';
        deltaEl.style.color      = result.scoreImproved ? '#2e7d32' : '#c62828';
        deltaLabelEl.textContent = result.scoreImproved ? 'Improved' : 'No improvement';
        deltaLabelEl.style.color = result.scoreImproved ? '#2e7d32' : '#c62828';

        // Word count
        var wcLine = 'Before: ' + result.origWordCount + ' words';
        if (result.compWords > 0) wcLine += ' (competitor: ' + result.compWords + ')';
        wcLine += '\nAfter:  ' + result.w8cWordCount + ' words (' + (result.wordDelta > 0 ? '+' : '') + result.wordDelta + ')';
        document.getElementById('w8dWordCount').innerText = wcLine;

        // Measure label
        document.getElementById('w8dNotes').textContent = 'PRIMARY MEASURE: ' + result.primaryMeasure + '\n\n' + (result.notes || '');

        document.getElementById('w8dResultBlock').style.display  = 'block';
        document.getElementById('w8dDecisionBlock').style.display = 'block';

        setStatus('statusW8D', result.scoreImproved ? 'done' : 'fail',
          result.scoreImproved ? '✔ Improvement confirmed — review then push W8C to New HTML' : '⚠ No improvement detected — review before pushing');
      })
      .withFailureHandler(function(err) { setStatus('statusW8D', 'fail', '❌ ' + err.message); })
      .getW8DAnalysis();
  }

  function runPushW8CToNewHtml() {
    setStatus('statusW8D', 'running', 'Pushing W8C HTML to New HTML column…', true);
    google.script.run
      .withSuccessHandler(function(result) {
        var el = document.getElementById('w8dPushResult');
        el.style.display = 'block';
        if (result.success) {
          el.textContent = '✔ ' + result.message;
          el.style.color = '#2e7d32';
          setStatus('statusW8D', 'done', '✔ W8C pushed to New HTML — proceed to publish');
        } else {
          el.textContent = '❌ ' + result.message;
          el.style.color = '#c62828';
          setStatus('statusW8D', 'fail', '❌ ' + result.message);
        }
      })
      .withFailureHandler(function(err) { setStatus('statusW8D', 'fail', '❌ ' + err.message); })
      .pushW8CToNewHtml();
  }

  function runW8DReject() {
    var el = document.getElementById('w8dPushResult');
    el.style.display = 'block';
    el.textContent   = 'W8C rejected — original New HTML preserved.';
    el.style.color   = '#c62828';
    setStatus('statusW8D', 'fail', 'W8C rejected — original content kept');
  }

  /* ══ W8-M — Media Gap Tool ══ */
  var _w8mLoadedHtml = '';

  function runW8MLoadHtml() {
    setStatus('statusW8M', 'running', 'Loading New HTML (col 98)…', true);
    google.script.run
      .withSuccessHandler(function(html) {
        if (!html || html.indexOf('ERROR') === 0) {
          setStatus('statusW8M', 'fail', '❌ ' + (html || 'No HTML found in New HTML column.'));
          return;
        }
        _w8mLoadedHtml = html;
        document.getElementById('w8mInputHtml').value = html;
        document.getElementById('w8mHtmlBlock').style.display = 'block';
        setStatus('statusW8M', 'done', '✔ New HTML loaded — click Generate Media Gap Prompt, or use Clear & Paste to load different content first.');
      })
      .withFailureHandler(function(err) {
        setStatus('statusW8M', 'fail', '❌ Load failed — ' + err.message);
      })
      .getHtmlFromActiveRow();
  }

  function runW8MGeneratePrompt() {
    var overrideHtml = document.getElementById('w8mInputHtml').value.trim();
    setStatus('statusW8M', 'running', 'Building media gap prompt…', true);
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success) {
          setStatus('statusW8M', 'fail', '❌ ' + (result ? result.message : 'Unknown error'));
          return;
        }
        document.getElementById('w8mPrompt').value = result.prompt;
        document.getElementById('w8mPromptBlock').style.display = 'block';
        setStatus('statusW8M', 'done', '✔ Prompt ready — copy to Gemini');
      })
      .withFailureHandler(function(err) {
        setStatus('statusW8M', 'fail', '❌ ' + err.message);
      })
      .buildW8MediaGapPrompt(overrideHtml);
  }

  function saveW8MOutput() {
    var html = document.getElementById('w8mOutputHtml').value.trim();
    if (!html) { setStatus('statusW8M', 'fail', '❌ No HTML to save — paste your finished HTML first'); return; }
    var btn = document.getElementById('w8mSaveBtn');
    btn.disabled = true; btn.innerText = 'Saving…';
    setStatus('statusW8M', 'running', 'Saving to W8 Media Gap HTML (col FY)…', true);
    google.script.run
      .withSuccessHandler(function(result) {
        var el = document.getElementById('w8mSaveResult');
        el.style.display = 'block';
        if (result.success) {
          el.textContent = '✔ ' + result.message;
          el.style.color = '#2e7d32';
          btn.innerText = '✔ Saved';
          setStatus('statusW8M', 'done', '✔ Saved — copy this into New HTML manually once you\'ve finished adding images in WordPress.');
        } else {
          el.textContent = '❌ ' + result.message;
          el.style.color = '#c62828';
          btn.disabled = false;
          btn.innerText = '⬇ Save to W8 Media Gap HTML';
          setStatus('statusW8M', 'fail', '❌ Save failed');
        }
      })
      .withFailureHandler(function(err) {
        setStatus('statusW8M', 'fail', '❌ ' + err.message);
        btn.disabled = false;
        btn.innerText = '⬇ Save to W8 Media Gap HTML';
      })
      .saveW8MediaGapHtml(html);
  }

function copyDeferredFixPrompt() {
    var ta = document.getElementById('deferredFixPrompt');
    if (!ta || !ta.value) return;
    navigator.clipboard.writeText(ta.value)
      .then(function() { setStatus('statusFinal','ready','✔ Fix prompt copied — paste into a NEW ChatGPT chat, paste corrected HTML back, then click Apply Fix.'); })
      .catch(function() { ta.select(); document.execCommand('copy'); });
  }

  function applyDeferredFix() {
    var html = document.getElementById('deferredFixHtml').value.trim();
    if (!html) { setStatus('statusFinal','fail','❌ Paste the corrected HTML first.'); return; }
    _atomicHtml = html;
    document.getElementById('finalHtmlPreview').value = _atomicHtml;
    setStatus('statusFinal','running','Re-running deferred checks…',true);
    google.script.run
      .withSuccessHandler(function(prompt) {
        var fixSection = document.getElementById('htmlFixSection');
        fixSection.style.display = 'block';
        fixSection.innerHTML =
          '<div style="font-family:JetBrains Mono,monospace;font-size:11px;font-weight:700;color:#1a237e;margin-bottom:4px;">📋 DEFERRED CHECKS — CHECKS 1, 4, 5, 7</div>' +
          '<div style="font-family:JetBrains Mono,monospace;font-size:10px;color:#555;margin-bottom:6px;">Copy this prompt → paste to ChatGPT → paste response below</div>' +
          '<textarea id="deferredCheckPrompt" style="height:120px;border-color:#1a237e;width:100%;font-size:10px;" readonly></textarea>' +
          '<div class="btn-row" style="margin-top:4px;">' +
          '<button class="btn-copy" onclick="copyDeferredPrompt()">Copy Prompt</button>' +
          '</div>' +
          '<div style="margin-top:8px;font-family:JetBrains Mono,monospace;font-size:10px;font-weight:600;color:#333;">Paste ChatGPT response here:</div>' +
          '<textarea id="deferredCheckResponse" style="height:80px;width:100%;font-size:10px;margin-top:4px;" placeholder="Paste ChatGPT response here…"></textarea>' +
          '<div class="btn-row" style="margin-top:4px;">' +
          '<button class="btn-copy" onclick="clearAndPaste(\'deferredCheckResponse\')" style="background:#37474f;color:#fff">⌫ Clear + Paste</button>' +
          '<button class="btn-push" onclick="processDeferredResponse()" style="background:#1a237e;color:#fff;">✔ Process Response</button>' +
          '</div>' +
          '<div id="deferredCheckResult" style="display:none;margin-top:8px;font-family:JetBrains Mono,monospace;font-size:11px;"></div>';
        document.getElementById('deferredCheckPrompt').value = prompt;
        setStatus('statusFinal','ready','✔ HTML updated — deferred check prompt rebuilt. Copy and re-run checks.');
      })
      .withFailureHandler(function(err) {
        setStatus('statusFinal','fail','❌ Failed to rebuild deferred check prompt — ' + err.message);
      })
      .buildDeferredCheckPrompt(_atomicHtml);
  }

/* ══ W4.5 — Competitor SERP Notes Automated ══ */

function runCompetitorSerpNotesAutomated() {

  var btn =
    document.getElementById(
      'serpNotesAutoBtn'
    );

  var resultEl =
    document.getElementById(
      'serpNotesResult'
    );

  var startTime =
    Date.now();

  btn.disabled = true;
  btn.innerText = 'Running…';

  if (resultEl) {
    resultEl.style.display = 'none';
    resultEl.textContent = '';
  }

  setStatus(
    'statusSerpNotes',
    'running',
    '⏳ W4.5 running grounded Google UK search... 0s',
    true
  );


  var progressTimer =
    setInterval(
      function() {

        var elapsed =
          Math.floor(
            (
              Date.now() -
              startTime
            ) / 1000
          );

        setStatus(
          'statusSerpNotes',
          'running',
          '⏳ W4.5 running grounded Google UK search... ' +
          elapsed +
          's',
          true
        );

      },
      1000
    );


  google.script.run

    .withSuccessHandler(
      function(res) {

        clearInterval(
          progressTimer
        );

        var elapsedSeconds =
          Math.floor(
            (
              Date.now() -
              startTime
            ) / 1000
          );

        btn.disabled = false;

        btn.innerText =
          '⚡ Run W4.5 Automated';


        if (
          !res ||
          !res.success
        ) {

          var failMessage =
            res &&
            res.message
              ? res.message
              : 'Unknown W4.5 error';

          setStatus(
            'statusSerpNotes',
            'fail',
            '❌ ' +
            failMessage +
            ' — ' +
            elapsedSeconds +
            's'
          );

          return;
        }


        var message =
          '✔ ' +
          res.message +
          ' — ' +
          elapsedSeconds +
          's — Cost: $' +
          Number(
            res.cost || 0
          ).toFixed(4);


        setStatus(
          'statusSerpNotes',
          'done',
          message
        );


        if (resultEl) {

          resultEl.style.display =
            'block';

          resultEl.textContent =
            'Search term: ' +
            (
              res.term ||
              ''
            ) +
            '\n' +
            'Organic results found: ' +
            Number(
              res.resultsFound || 0
            ) +
            '\n' +
            'Saved to: Competitor SERP Notes';
        }
      }
    )


    .withFailureHandler(
      function(err) {

        clearInterval(
          progressTimer
        );

        var elapsedSeconds =
          Math.floor(
            (
              Date.now() -
              startTime
            ) / 1000
          );

        btn.disabled = false;

        btn.innerText =
          '⚡ Run W4.5 Automated';

        setStatus(
          'statusSerpNotes',
          'fail',
          '❌ W4.5 failed — ' +
          err.message +
          ' — ' +
          elapsedSeconds +
          's'
        );
      }
    )


    .bc_runCompetitorSerpNotesAutomated();
}
</script>
