<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      color: #333;
      margin: 0;
    }
    h3 {
      font-size: 15px;
      color: #1a73e8;
      margin: 0 0 12px 0;
    }
    #statusBox {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: 12px;
      min-height: 200px;
      max-height: 240px;
      overflow-y: auto;
      line-height: 1.8;
    }
    .phase    { font-weight: bold; color: #1a73e8; margin-top: 6px; }
    .ok       { color: #0d652d; }
    .running  { color: #e37400; }
    .error    { color: #c62828; font-weight: bold; }
    .complete { color: #0d652d; font-weight: bold; margin-top: 8px; }
    .slug     { color: #6a1b9a; font-weight: bold; }
    #closeBtn {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #closeBtn:hover { background: #1558b0; }
  </style>
</head>
<body>
  <h3>GSC Row Stats — Active Row</h3>
  <div id="statusBox">
    <span class="running">⏳ Connecting to GSC API...</span>
  </div>
  <button id="closeBtn" onclick="google.script.host.close()">Close</button>

  <script>
    function appendStatus(html) {
      var box = document.getElementById('statusBox');
      box.innerHTML += '<br>' + html;
      box.scrollTop = box.scrollHeight;
    }

    function runStats() {
      var box = document.getElementById('statusBox');
      box.innerHTML = '<span class="running">⏳ Fetching page statistics from GSC API...</span>';

      google.script.run
        .withSuccessHandler(function(result) {
          box.innerHTML = '';

          appendStatus('<span class="slug">Slug: ' + result.slug + '</span>');
          appendStatus('');

          result.phases.forEach(function(phase) {
            appendStatus('<span class="phase">▶ ' + phase.label + '</span>');
            appendStatus('<span class="ok">   Dates: ' + phase.dates + '</span>');
            appendStatus('<span class="ok">   Clicks: ' + phase.clicks + ' | Impressions: ' + phase.impr + ' | CTR: ' + (phase.ctr * 100).toFixed(2) + '% | Position: ' + phase.pos + '</span>');
          });

          appendStatus('');
          appendStatus('<span class="complete">✔ Posts sheet updated — only higher values written</span>');

          document.getElementById('closeBtn').style.display = 'block';
        })
        .withFailureHandler(function(err) {
          box.innerHTML = '<span class="error">❌ Error: ' + err.message + '</span>';
          document.getElementById('closeBtn').style.display = 'block';
        })
        .runGSCRowStatsActiveRow();
    }

    runStats();
  </script>
</body>
</html>
