<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'JetBrains Mono', monospace; margin: 0; padding: 12px; background: #fafafa; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    button { font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
    #fieldBtns button { background: #37474f; }
    #fieldBtns button.active { background: #1565c0; }
    #wysiwygBtn { background: #6a1b9a; display: none; }
    #saveBtn { background: #2e7d32; }
    #closeBtn { background: #c62828; }
    textarea { width: 100%; height: 420px; font-size: 12px; font-family: 'JetBrains Mono', monospace; box-sizing: border-box; }
    #wysiwygPreview { width: 100%; height: 420px; overflow-y: auto; border: 1px solid #ccc; background: #fff; padding: 10px; box-sizing: border-box; display: none; }
    #status { font-size: 11px; margin: 8px 0; padding: 6px; border-radius: 4px; background: #eee; }
    #status.done { background: #e8f5e9; color: #2e7d32; }
    #status.fail { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>

  <div id="fieldBtns" class="btn-row">
    <button onclick="loadField('h1')" data-field="h1">H1</button>
    <button onclick="loadField('metaTitle')" data-field="metaTitle">Meta Title</button>
    <button onclick="loadField('metaDescription')" data-field="metaDescription">Meta Description</button>
    <button onclick="loadField('yoast')" data-field="yoast">Yoast</button>
    <button onclick="loadField('schema')" data-field="schema">Schema</button>
    <button onclick="loadField('html')" data-field="html">New HTML</button>
  </div>

  <div class="btn-row">
    <button id="wysiwygBtn" onclick="toggleWysiwyg()">View as WYSIWYG</button>
  </div>

  <div id="status">Click a button above to load that field for the active row.</div>

  <textarea id="editArea" placeholder="Field content will appear here…"></textarea>
  <div id="wysiwygPreview" contenteditable="true"></div>

  <div class="btn-row" style="margin-top:10px">
    <button id="saveBtn" onclick="saveField()">💾 Save</button>
    <button id="closeBtn" onclick="google.script.host.close()">✕ Close</button>
  </div>

  <script>
    var _currentField = null;
    var _wysiwygMode = false;

    function setStatus(msg, cls) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls || '';
    }

    function loadField(field) {
      _currentField = field;
      _wysiwygMode = false;
      document.getElementById('wysiwygPreview').style.display = 'none';
      document.getElementById('editArea').style.display = 'block';
      document.getElementById('wysiwygBtn').style.display = (field === 'html') ? 'inline-block' : 'none';
      document.getElementById('wysiwygBtn').textContent = 'View as WYSIWYG';

      var buttons = document.querySelectorAll('#fieldBtns button');
      buttons.forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-field') === field); });

      setStatus('Loading ' + field + '…');
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result.success) { setStatus(result.message, 'fail'); return; }
          document.getElementById('editArea').value = result.value;
          setStatus('Loaded ' + field + ' — edit below, then Save.', 'done');
        })
        .withFailureHandler(function(err) { setStatus('Error: ' + err.message, 'fail'); })
        .getPostUpdateField(field);
    }

    function toggleWysiwyg() {
      _wysiwygMode = !_wysiwygMode;
      var ta = document.getElementById('editArea');
      var pv = document.getElementById('wysiwygPreview');
      var btn = document.getElementById('wysiwygBtn');
      if (_wysiwygMode) {
        pv.innerHTML = ta.value;
        ta.style.display = 'none';
        pv.style.display = 'block';
        btn.textContent = 'View as HTML';
      } else {
        ta.value = pv.innerHTML;
        pv.style.display = 'none';
        ta.style.display = 'block';
        btn.textContent = 'View as WYSIWYG';
      }
    }

    function saveField() {
      if (!_currentField) { setStatus('Load a field first.', 'fail'); return; }
      var value = _wysiwygMode ? document.getElementById('wysiwygPreview').innerHTML : document.getElementById('editArea').value;
      setStatus('Saving…');
      google.script.run
        .withSuccessHandler(function(result) {
          setStatus(result.message, result.success ? 'done' : 'fail');
        })
        .withFailureHandler(function(err) { setStatus('Save error: ' + err.message, 'fail'); })
        .savePostUpdateField(_currentField, value);
    }
  </script>
</body>
</html>
