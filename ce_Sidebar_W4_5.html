    <span class="window-label"
          style="color:#00796b">
      W4.5 — Competitor SERP Notes
    </span>

    <span class="tag"
          style="background:#00796b">
      Gemini Grounded Search
    </span>

  </div>


  <div class="window-body">

    <div id="statusSerpNotes"
         class="status-bar pending">

         style="margin-top:8px">

    </div>


    <div id="serpNotesResult"
         style="
           display:none;
           margin-top:8px;

           font-size:12px;
           background:#e0f2f1;
           border-radius:4px;
           padding:8px;
           white-space:pre-wrap;
           color:#333;">

  </div>
