<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; font-size: 13px; color: #3c4043; }
      #status { color: #1a73e8; font-weight: 500; margin-bottom: 10px; }
      textarea { 
        width: 100%; height: 220px; font-family: "Roboto Mono", monospace; font-size: 10px; 
        margin-bottom: 15px; border: 1px solid #dadce0; border-radius: 4px; padding: 8px;
        box-sizing: border-box; background-color: #f8f9fa;
      }
      button { 
        background-color: #1a73e8; color: white; border: none; 
        padding: 12px; border-radius: 4px; cursor: pointer; width: 100%; 
        font-weight: 600; font-size: 14px; transition: background 0.2s;
      }
      button:hover { background-color: #174ea6; }
      button:active { background-color: #103d7c; }
    </style>
  </head>
  <body>
    <div id="status">Scanning Sheet...</div>
    <textarea id="dataBox" placeholder="Processing rows..."></textarea>
    <button id="copyBtn" onclick="copyAndClose()">Copy to Clipboard & Close</button>

    <script>
      // Load data immediately on sidebar open
      (function() {
        google.script.run.withSuccessHandler(function(data) {
          document.getElementById('dataBox').value = data;
          document.getElementById('status').innerText = "Data Extracted Successfully";
        }).getTabDelimitedData();
      })();

      function copyAndClose() {
        const copyText = document.getElementById("dataBox");
        const btn = document.getElementById("copyBtn");
        
        // Select and Copy
        copyText.select();
        navigator.clipboard.writeText(copyText.value).then(() => {
          btn.innerText = "Copied!";
          btn.style.backgroundColor = "#188038";
          // Small delay for visual feedback before closing
          setTimeout(() => {
            google.script.host.close();
          }, 400);
        }).catch(err => {
          alert("Clipboard error: " + err);
        });
      }
    </script>
  </body>
</html>
