name: Content Engine safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'consolidation/**'
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Master Register and protected features
    runs-on: ubuntu-latest
    steps:
      - name: Read repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Python safety tools compile
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8-sig'),filename=str(p)) for p in pathlib.Path('control').glob('*.py')]"
      - name: Verify changes are recorded and protected
        run: python control/release_gate.py --mode review
      - name: Verify deployment refuses unsafe attempts
        run: python control/test_deploy_safety.py
      - name: Simulate full release and failed releases without live calls
        run: python control/test_full_release_simulation.py
      - name: Verify isolated backup ZIP and refusal on wrong project
        run: python control/test_backup_safety.py
      - name: Verify independent readback detects source mismatches
        run: python control/test_readback_verifier.py
      - name: Verify official main meets the formal release gate (no deployment)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python control/release_gate.py --mode release
