<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 12px;
      }
      h2 {
        margin: 0 0 12px 0;
        font-size: 18px;
      }
      .note {
        margin: 0 0 12px 0;
        font-size: 13px;
        line-height: 1.4;
        color: #333;
      }
      textarea {
        width: 100%;
        height: 420px;
        box-sizing: border-box;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
      }
      .buttons {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
      }
      .copy-btn {
        background: #1a73e8;
        color: #fff;
        border: none;
      }
      .refresh-btn {
        background: #188038;
        color: #fff;
        border: none;
      }
      .close-btn {
        background: #f1f3f4;
        border: 1px solid #ccc;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #188038;
      }
      .error {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <h2>📝 Post Update Block</h2>

    <p class="note">
      This window outputs the active row in this exact order:<br>
      Post ID, New H1, New HTML, New Meta Title, New Meta Description, New Schema.
    </p>

    <textarea id="output" readonly></textarea>

    <div class="buttons">
      <button class="copy-btn" onclick="copyOutput()">Copy</button>
      <button class="refresh-btn" onclick="loadBlock()">Refresh</button>
      <button class="close-btn" onclick="google.script.host.close()">Close</button>
    </div>

    <div id="status" class="status"></div>

    <script>
      function loadBlock() {
        document.getElementById('status').textContent = 'Refreshing...';
        document.getElementById('status').className = 'status';

        google.script.run
          .withSuccessHandler(function(result) {
            document.getElementById('output').value = result;
            document.getElementById('status').textContent = 'Loaded from active row.';
            document.getElementById('status').className = 'status';
          })
          .withFailureHandler(function(error) {
            document.getElementById('output').value = 'Error: ' + error.message;
            document.getElementById('status').textContent = 'Could not load the active row.';
            document.getElementById('status').className = 'status error';
          })
          .getPostUpdateBlockFromActiveRow();
      }

      function copyOutput() {
        const textarea = document.getElementById('output');
        const text = textarea.value;

        navigator.clipboard.writeText(text).then(function() {
          document.getElementById('status').textContent = 'Copied to clipboard.';
          document.getElementById('status').className = 'status';
        }).catch(function() {
          textarea.select();
          textarea.setSelectionRange(0, 999999);
          document.getElementById('status').textContent = 'Copy failed.';
          document.getElementById('status').className = 'status error';
        });
      }

      loadBlock();
    </script>
  </body>
</html>
