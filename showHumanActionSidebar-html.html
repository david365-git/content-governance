<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background-color: #f8f9fa; color: #3c4043; }
      .header { font-weight: bold; margin-bottom: 10px; font-size: 14px; color: #1a73e8; }
      textarea {
        width: 100%;
        height: 70vh;
        margin-bottom: 15px;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #dadce0;
        border-radius: 8px;
        resize: none;
        font-family: 'Roboto Mono', monospace;
        font-size: 12px;
        line-height: 1.5;
        background-color: #ffffff;
        outline: none;
      }
      textarea:focus { border: 2px solid #1a73e8; padding: 11px; }
      .btn {
        background-color: #1a73e8;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn:hover { background-color: #1765cc; }
      .btn:active { background-color: #1255b3; }
      .status { font-size: 12px; text-align: center; margin-top: 10px; height: 15px; color: #188038; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="header">Consolidated Output</div>
    <textarea id="outputField" readonly><?= combinedPrompt ?></textarea>
    <button class="btn" onclick="copyToClipboard()">Copy to Clipboard</button>
    <div id="statusMsg" class="status"></div>

    <script>
      function copyToClipboard() {
        const textArea = document.getElementById("outputField");
        textArea.select();
        textArea.setSelectionRange(0, 99999);
        
        try {
          const successful = document.execCommand("copy");
          const msg = successful ? "Copied to clipboard!" : "Copy failed.";
          showStatus(msg);
        } catch (err) {
          showStatus("Error copying.");
        }
      }

      function showStatus(text) {
        const status = document.getElementById("statusMsg");
        status.innerText = text;
        setTimeout(() => { status.innerText = ""; }, 2500);
      }
    </script>
  </body>
</html>
