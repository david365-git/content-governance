<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 15px;
        background-color: #f8f9fa;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      #status {
        font-size: 12px;
        color: #5f6368;
        height: 18px;
        margin-bottom: 2px;
      }

      .btn {
        width: 100%;
        padding: 10px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        border: none;
        transition: background 0.2s;
      }

      .btn-primary {
        background-color: #1a73e8;
        color: white;
      }

      .btn-primary:hover {
        background-color: #1765cc;
      }

      .btn-secondary {
        background-color: #ffffff;
        color: #1a73e8;
        border: 1px solid #dadce0;
      }

      .btn-secondary:hover {
        background-color: #f1f3f4;
      }

      textarea {
        width: 100%;
        height: 380px;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        padding: 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        margin-top: 10px;
        box-sizing: border-box;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <strong>D60 Governance Controller</strong>
      <div id="status">Ready...</div>

      <button class="btn btn-primary" onclick="generateLLMPackage()">
        Generate Final Prompt
      </button>

      <button class="btn btn-secondary" onclick="copyToClipboard()">
        Copy to Clipboard
      </button>

      <textarea id="output-box" placeholder="LLM Output will appear here..."></textarea>
    </div>

    <script>
      function generateLLMPackage() {
        const status = document.getElementById('status');
        status.innerText = "Compiling D60, Matrix & Governance data...";
        status.style.color = "#1a73e8";

        google.script.run
          .withSuccessHandler(renderOutput)
          .withFailureHandler(handleError)
          .getCustomDataPackage();
      }

      function renderOutput(data) {
        if (data.isError) {
          handleError(data.message);
          return;
        }

        // Apps Script now returns the FULL assembled prompt.
        // Do not split, modify, or rebuild it.
        document.getElementById('output-box').value = data.masterPrompt;

        const status = document.getElementById('status');
        status.innerText = "Package ready!";
        status.style.color = "#188038";
      }

      function handleError(err) {
        const status = document.getElementById('status');
        status.innerText = "Error: " + err;
        status.style.color = "#d93025";
      }

      function copyToClipboard() {
        const copyText = document.getElementById("output-box");

        if (!copyText.value) {
          document.getElementById('status').innerText = "Nothing to copy!";
          return;
        }

        copyText.select();
        document.execCommand("copy");

        const status = document.getElementById('status');
        const oldText = status.innerText;
        status.innerText = "Copied to clipboard!";
        setTimeout(() => status.innerText = oldText, 2000);
      }
    </script>
  </body>
</html>
